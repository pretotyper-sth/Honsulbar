name: Safety alert retry and evidence retention
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: safety-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retry due notifications and delete expired evidence
        run: node scripts/safety-maintenance.js
