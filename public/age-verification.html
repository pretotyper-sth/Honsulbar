<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>혼술바 본인인증 테스트</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171315;color:#f5e8df;font:16px/1.75 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;word-break:keep-all}main{max-width:520px;margin:40px auto;padding:24px}h1{font-size:25px}p{color:#d3c1b8}button,a{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:#e7b77e;color:#261a17;font:inherit;font-weight:700;text-align:center;text-decoration:none;margin:20px 0;cursor:pointer}button:disabled{opacity:.5}a[hidden],button[hidden]{display:none}small{color:#b9a59c}#status{min-height:28px}</style></head><body><main><strong>혼술바</strong><h1>본인인증 테스트</h1><p>이니시스 테스트 인증 화면으로 이동합니다. 인증에 필요한 이름·생년월일·전화번호 등은 포트원과 인증사에서 처리합니다. 혼술바 서버는 인증 결과를 조회해 연령을 확인하며 원문을 저장하지 않습니다.</p><p>테스트 결과는 운영 회원의 성인 확인 상태에 반영하지 않습니다.</p><button id="start">동의하고 테스트 인증하기</button><p id="status" role="status"></p><a id="back" hidden>앱으로 돌아가 결과 확인</a><small>실상점 계약·결제 기능을 사용하지 않는 테스트 전용 채널입니다.</small></main><script>
const params=new URLSearchParams(location.search),attempt=params.get('attemptId'),start=document.querySelector('#start'),status=document.querySelector('#status'),back=document.querySelector('#back');
if(!/^ha-\d{10}-[a-f0-9]{16}-[a-f0-9]{32}$/.test(attempt||'')||params.getAll('attemptId').length!==1){start.disabled=true;status.textContent='앱에서 인증을 다시 시작해 주세요.';}else{
 back.href='com.honsulbar.app://identity/callback?id='+encodeURIComponent(attempt);
 if(params.has('identityVerificationId')||params.has('code')){start.hidden=true;back.hidden=false;status.textContent=params.get('identityVerificationId')===attempt&&!params.has('code')?'앱으로 돌아가 인증 결과를 확인해 주세요.':'인증을 완료하지 못했어요. 앱에서 다시 시도해 주세요.';}
 start.addEventListener('click',async()=>{start.disabled=true;status.textContent='인증 화면을 여는 중이에요.';try{
  if(!window.PortOne)await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src='https://cdn.portone.io/v2/browser-sdk.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s);});
  const redirect=new URL(location.href);redirect.search=new URLSearchParams({attemptId:attempt});
  const result=await PortOne.requestIdentityVerification({storeId:'store-16090281-7030-4ca7-96f8-8d842e69bf32',channelKey:'channel-key-54b44a2c-5bd1-45bb-b891-78ae62ca4981',identityVerificationId:attempt,redirectUrl:redirect.href,bypass:{inicisUnified:{flgFixedUser:'N',FRGNDInfo:'N'}}});
  if(result?.code||result?.identityVerificationId!==attempt)throw Error();status.textContent='앱으로 돌아가 인증 결과를 확인해 주세요.';back.hidden=false;
 }catch{status.textContent='인증을 완료하지 못했어요. 다시 시도해 주세요.';start.disabled=false;back.hidden=false;}});
}
</script></body></html>
